services:
  postgres:
    image: postgres:16
    container_name: cinema-arcano-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema_arcano
    ports:
      - "5432:5432"
    volumes:
      - cinema_arcano_pgdata:/var/lib/postgresql/data

volumes:
  cinema_arcano_pgdata: